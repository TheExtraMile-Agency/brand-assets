<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Extra Mile</title>
<meta name="description" content="The Extra Mile — websites, automation, and practical tools for small businesses. Site under construction.">
<meta name="robots" content="noindex">
<meta property="og:title" content="The Extra Mile">
<meta property="og:description" content="Websites, automation, and practical tools for small businesses. Site under construction.">
<meta property="og:type" content="website">
<link rel="icon" href="logo-signature-orange.png">
<style>
  :root{
    --paper:#f4f2eb;
    --surface:#fffefa;
    --ink:#181a17;
    --muted:#62645c;
    --signal:#ff5a32;
    --line:#d9d9cf;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#121310;
      --surface:#1a1c18;
      --ink:#f2f1ea;
      --muted:#9a9c92;
      --line:#2e312a;
    }
  }
  :root[data-theme="dark"]{
    --paper:#121310;
    --surface:#1a1c18;
    --ink:#f2f1ea;
    --muted:#9a9c92;
    --line:#2e312a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:560px;
    text-align:center;
  }
  .track{
    width:min(420px,84vw);
    height:auto;
    display:block;
    margin:0 auto 34px;
  }
  .ring{fill:none;stroke:var(--ink);stroke-width:14;opacity:.9}
  .lane{fill:none;stroke:var(--ink);stroke-width:2;opacity:.16}
  .runner{fill:var(--signal)}
  @media (prefers-reduced-motion: reduce){
    .runner-motion{display:none}
    .runner-static{display:block}
  }
  .runner-static{display:none}
  h1{
    font-size:clamp(22px,5vw,30px);
    letter-spacing:.14em;
    font-weight:800;
    margin:0 0 18px;
    text-transform:uppercase;
  }
  .rule{
    width:54px;height:3px;background:var(--signal);
    margin:0 auto 20px;border-radius:2px;
  }
  .status{
    font-size:clamp(15px,3.4vw,17px);
    color:var(--muted);
    margin:0 0 8px;
    line-height:1.55;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0 0 30px;
    line-height:1.6;
  }
  .contact{
    display:inline-flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px 18px;
    padding:16px 22px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14px;
  }
  .contact a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
  }
  .contact a:hover{border-bottom-color:var(--signal)}
  .contact .name{font-weight:700}
  footer{
    margin-top:34px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.04em;
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="track" viewBox="-20 -30 760 500" role="img" aria-label="The Extra Mile running track, with a runner circling it">
      <defs>
        <path id="lap" d="M 220,40 H 500 A 180,180 0 0 1 500,400 H 220 A 180,180 0 0 1 220,40 Z"/>
      </defs>

      <use href="#lap" class="ring"/>
      <path class="lane" d="M 232,64 H 488 A 156,156 0 0 1 488,376 H 232 A 156,156 0 0 1 232,64 Z"/>
      <path class="lane" d="M 244,88 H 476 A 132,132 0 0 1 476,352 H 244 A 132,132 0 0 1 244,88 Z"/>
      <path class="lane" d="M 256,112 H 464 A 108,108 0 0 1 464,328 H 256 A 108,108 0 0 1 256,112 Z"/>

      <circle class="runner runner-static" r="26" cx="500" cy="40"/>
      <circle class="runner runner-motion" r="26">
        <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
          <mpath href="#lap"/>
        </animateMotion>
      </circle>
    </svg>

    <h1>The Extra Mile</h1>
    <div class="rule"></div>
    <p class="status">This site is under construction.</p>
    <p class="sub">Websites, automation, and practical tools for small businesses.<br>The work is real, the website just isn't finished yet.</p>

    <div class="contact">
      <span class="name">Mordechai Edery</span>
      <a href="tel:+16133558301">613-355-8301</a>
      <a href="mailto:mordechai@theextramile.io">mordechai@theextramile.io</a>
    </div>

    <footer>&copy; <span id="y">2026</span> The Extra Mile</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
